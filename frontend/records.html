<!doctype html><meta charset="utf-8"><title>历史记录</title><link rel="stylesheet" href="/assets/css/common.css"><main><h1>历史巡检</h1><a href="/">新建巡检</a><div id="list"></div></main><script>fetch('/api/inspections').then(r=>r.json()).then(a=>list.innerHTML=a.map(x=>`<article><b>#${x.id} ${x.scene}</b><span>${new Date(x.created_at).toLocaleString()}</span> <a href="/report?id=${x.id}">查看报告</a></article>`).join('')||'<p>暂无记录</p>')</script>
