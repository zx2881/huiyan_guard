<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>慧眼安巡</title><link rel="stylesheet" href="/assets/css/common.css"><body><main><h1>慧眼安巡</h1><p>上传现场照片，生成校园安全巡检记录。</p><form id="f"><label>检查场景 <select name="scene"><option value="dormitory">学生宿舍</option><option value="laboratory">实验室</option></select></label><label>现场照片 <input name="image" type="file" accept="image/*" required></label><button>开始巡检</button></form><p id="msg"></p><nav><a href="/records">历史记录</a></nav></main><script>f.onsubmit=async e=>{e.preventDefault();msg.textContent='正在保存…';let r=await fetch('/api/inspections',{method:'POST',body:new FormData(f)});let d=await r.json();msg.textContent=r.ok?'完成，报告编号 '+d.id:'失败：'+(d.detail||'未知错误');if(r.ok)location='/report?id='+d.id}</script></body></html>
